services:
  - type: web
    name: fizi-backend
    env: docker
    dockerfilePath: ./python_server/Dockerfile
    dockerContext: ./python_server
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 5001
      - key: FLASK_ENV
        value: production

  - type: cron
    name: fizi-daily-nudge
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    schedule: "0 8 * * *"
    startCommand: "node scripts/daily-nudge.js"
    region: oregon
    plan: starter
